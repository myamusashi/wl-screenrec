name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libclang-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev wayland-protocols
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --release
      - name: Test
        run: cargo test --workspace -- --test-threads=1
